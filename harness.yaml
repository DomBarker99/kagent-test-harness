# The three objects that run this image as a kagent agent.
# Nothing applies this file yet: the image line needs a real registry and digest first.
# Once the agent works, these belong in helm/agents/ so Argo owns them.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: byo-test-harness
  namespace: kagent
spec:
  # byo: kagent runs the image as it is and only talks A2A to it.
  byo: {}
  workload:
    # The pushed image, pinned by digest. A tag alone is rejected.
    image: REGISTRY/kagent-test-harness@sha256:DIGEST
    # Required for byo: kagent will not infer the image's entrypoint.
    command: ["/usr/local/bin/harness-shell"]
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: byo-test-template
  namespace: kagent
spec:
  # A nameplate only. The image ignores the template for now (an "opaque" agent),
  # so there is no model, prompt or tool list here.
  description: Test agent implemented by the kagent-test-harness image
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: byo-test-agent
  namespace: kagent
spec:
  template:
    ref:
      name: byo-test-template
  harnessRef:
    name: byo-test-harness
